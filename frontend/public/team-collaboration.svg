<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Team collaboration illustration</title>
  <desc id="desc">Three colleagues around a table reviewing a property map and documents.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e8fc0"/><stop offset="1" stop-color="#8cc63f"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f3f9"/><stop offset="1" stop-color="#eef8e2"/></linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8eef7"/><stop offset="1" stop-color="#e4f3d3"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0d2a3b" flood-opacity="0.16"/></filter>
  </defs>

  <ellipse cx="320" cy="210" rx="290" ry="180" fill="url(#bg)"/>
  <ellipse cx="320" cy="372" rx="240" ry="16" fill="#0d2a3b" opacity="0.07"/>

  <!-- floating accents -->
  <g filter="url(#s)">
    <rect x="272" y="40" width="96" height="46" rx="14" fill="#fff"/>
    <path d="M308 86l-8 14 20-14z" fill="#fff"/>
  </g>
  <circle cx="298" cy="63" r="11" fill="url(#g)"/>
  <path d="M292 63l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="318" y="55" width="36" height="6" rx="3" fill="#b9d3df"/>
  <rect x="318" y="67" width="24" height="6" rx="3" fill="#d6e4eb"/>

  <!-- person left -->
  <g>
    <path d="M118 176c0-22 18-38 40-38h8c22 0 40 16 40 38v100H118z" fill="#0e8fc0"/>
    <path d="M158 138h8v14h-8z" fill="#e0ac86"/>
    <circle cx="162" cy="116" r="26" fill="#e0ac86"/>
    <path d="M136 112c0-18 12-30 28-30 15 0 26 10 26 26-10-4-20-10-26-18-6 12-16 18-28 22z" fill="#1f2a33"/>
    <path d="M196 188c26 18 40 44 50 62" fill="none" stroke="#0e8fc0" stroke-width="16" stroke-linecap="round"/>
    <circle cx="249" cy="254" r="9" fill="#e0ac86"/>
  </g>

  <!-- person center -->
  <g>
    <path d="M278 176c0-22 18-38 40-38h8c22 0 40 16 40 38v100H278z" fill="#12a39a"/>
    <path d="M318 138h8v14h-8z" fill="#c98f65"/>
    <circle cx="322" cy="116" r="26" fill="#c98f65"/>
    <path d="M296 118c-4-22 10-38 28-38s32 14 28 38c-4-10-10-18-18-22-10 8-22 14-38 22z" fill="#3b2a22"/>
    <path d="M300 186c-12 22-14 44-6 62" fill="none" stroke="#12a39a" stroke-width="16" stroke-linecap="round"/>
    <circle cx="294" cy="252" r="9" fill="#c98f65"/>
  </g>

  <!-- person right -->
  <g>
    <path d="M438 176c0-22 18-38 40-38h8c22 0 40 16 40 38v100H438z" fill="#8cc63f"/>
    <path d="M478 138h8v14h-8z" fill="#f2c9a5"/>
    <circle cx="482" cy="116" r="26" fill="#f2c9a5"/>
    <path d="M456 114c0-18 12-32 28-32s28 12 26 30c-12-2-22-8-26-16-6 10-16 16-28 18z" fill="#1f2a33"/>
    <path d="M444 188c-26 18-38 42-46 60" fill="none" stroke="#8cc63f" stroke-width="16" stroke-linecap="round"/>
    <circle cx="395" cy="252" r="9" fill="#f2c9a5"/>
  </g>

  <!-- table -->
  <g filter="url(#s)">
    <rect x="70" y="268" width="500" height="26" rx="13" fill="#fff"/>
  </g>
  <rect x="110" y="294" width="14" height="78" rx="7" fill="#b9d3df"/>
  <rect x="516" y="294" width="14" height="78" rx="7" fill="#b9d3df"/>

  <!-- map sheet with pin -->
  <path d="M236 266l26-34h118l26 34z" fill="url(#map)" stroke="#bcd9e6" stroke-width="2" stroke-linejoin="round"/>
  <path d="M276 248c20-8 34 6 56-2s34-4 48 2M262 262c26-8 44 4 64-2s40-4 60 0" fill="none" stroke="#9ccbe0" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(314 206)">
    <path d="M12 38S-6 24-6 10a18 18 0 0 1 36 0c0 14-18 28-18 28z" fill="#0a6a93"/>
    <circle cx="12" cy="10" r="6" fill="#fff"/>
  </g>

  <!-- documents (left) -->
  <rect x="110" y="236" width="56" height="32" rx="4" fill="#d6e4eb"/>
  <g filter="url(#s)">
    <rect x="124" y="222" width="62" height="46" rx="5" fill="#fff"/>
  </g>
  <rect x="132" y="232" width="26" height="5" rx="2.5" fill="url(#g)"/>
  <rect x="132" y="243" width="44" height="4" rx="2" fill="#d6e4eb"/>
  <rect x="132" y="252" width="36" height="4" rx="2" fill="#d6e4eb"/>

  <!-- laptop (right) -->
  <g filter="url(#s)">
    <rect x="452" y="214" width="76" height="48" rx="6" fill="#0d2a3b"/>
  </g>
  <rect x="458" y="220" width="64" height="36" rx="3" fill="#e8f4f9"/>
  <rect x="464" y="228" width="26" height="5" rx="2.5" fill="url(#g)"/>
  <rect x="464" y="238" width="44" height="4" rx="2" fill="#b9d3df"/>
  <rect x="464" y="246" width="34" height="4" rx="2" fill="#b9d3df"/>
  <rect x="444" y="262" width="92" height="6" rx="3" fill="#9fb6c4"/>
</svg>
