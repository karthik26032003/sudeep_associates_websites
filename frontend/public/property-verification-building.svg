<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Property verification illustration</title>
  <desc id="desc">A modern building connected to a verified title document, location marker and security shield.</desc>
  <defs>
    <linearGradient id="ground" x1="70" y1="430" x2="670" y2="430" gradientUnits="userSpaceOnUse">
